# Stellio NGSI-LD Context Broker — minimal test stack
# NGSI-LD API: http://localhost:8080/ngsi-ld/v1

services:
  postgres:
    image: docker.io/stellio/stellio-timescale-postgis:16-2.26.4-3.6
    container_name: test-stellio-postgres
    environment:
      POSTGRES_USER: stellio
      POSTGRES_PASS: stellio_password
      POSTGRES_DBNAME: stellio_search,stellio_subscription
      POSTGRES_MULTIPLE_EXTENSIONS: postgis,timescaledb,pgcrypto
      ACCEPT_TIMESCALE_TUNING: "TRUE"
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U stellio"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 15s

  kafka:
    image: docker.io/confluentinc/cp-kafka:8.1.0
    container_name: test-stellio-kafka
    hostname: stellio-kafka
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://stellio-kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_NODE_ID: 1
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@stellio-kafka:29093
      KAFKA_LISTENERS: CONTROLLER://stellio-kafka:29093,PLAINTEXT://stellio-kafka:9092,PLAINTEXT_HOST://0.0.0.0:29092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LOG4J_ROOT_LOGLEVEL: INFO
      CLUSTER_ID: ZGE2MTQ4NDk4NGU3NDE2Mm

  search-service:
    image: docker.io/stellio/stellio-search-service:latest-dev
    container_name: test-stellio-search-service
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_R2DBC_URL: r2dbc:pool:postgresql://postgres/stellio_search
      SPRING_FLYWAY_URL: jdbc:postgresql://postgres/stellio_search
      SPRING_R2DBC_USERNAME: stellio
      SPRING_R2DBC_PASSWORD: stellio_password
      APPLICATION_AUTHENTICATION_ENABLED: "false"
      APPLICATION_TENANTS_0_NAME: urn:ngsi-ld:tenant:default
      APPLICATION_TENANTS_0_DBSCHEMA: public
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started

  subscription-service:
    image: docker.io/stellio/stellio-subscription-service:latest-dev
    container_name: test-stellio-subscription-service
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_R2DBC_URL: r2dbc:pool:postgresql://postgres/stellio_subscription
      SPRING_FLYWAY_URL: jdbc:postgresql://postgres/stellio_subscription
      SPRING_R2DBC_USERNAME: stellio
      SPRING_R2DBC_PASSWORD: stellio_password
      APPLICATION_AUTHENTICATION_ENABLED: "false"
      APPLICATION_TENANTS_0_NAME: urn:ngsi-ld:tenant:default
      APPLICATION_TENANTS_0_DBSCHEMA: public
      SUBSCRIPTION_ENTITY_SERVICE_URL: http://search-service:8083
      SUBSCRIPTION_STELLIO_URL: http://api-gateway:8080
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started

  api-gateway:
    image: docker.io/stellio/stellio-api-gateway:latest-dev
    container_name: test-stellio-api-gateway
    environment:
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
      search-service:
        condition: service_started
      subscription-service:
        condition: service_started
